<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FLOOR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 32px; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 500; font-size: 42px; margin: 16px 0 8px; }
      p { color: #a1a1aa; max-width: 28rem; line-height: 1.5; }
      button { margin-top: 20px; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #e4e4e7; color: #0a0a0b; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
        <rect x="4" y="7" width="24" height="3.2" rx="0.4" fill="#f4f4f5" />
        <rect x="4" y="14.4" width="18" height="3.2" rx="0.4" fill="#f4f4f5" opacity="0.72" />
        <rect x="4" y="21.8" width="12" height="3.2" rx="0.4" fill="#f4f4f5" opacity="0.42" />
      </svg>
      <h1>FLOOR</h1>
      <p>The house is online. If you are seeing this page, the native shell could not reach the live floor. Check the network and open again.</p>
      <button type="button" onclick="location.reload()">Retry the floor</button>
    </main>
  </body>
</html>
